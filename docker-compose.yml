services:
  payments:
    build: ./services/payments
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://payments:payments@db:5432/payments
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"

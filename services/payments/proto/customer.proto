syntax = "proto3";

package acme.payments.v1;

option go_package = "github.com/acme/checkout/services/payments/proto;paymentspb";

service Customers {
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
}

message GetCustomerRequest {
  string customer_id = 1;
}

message Customer {
  string id = 1;
  string email = 2;
}
